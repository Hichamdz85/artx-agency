  logistics workflow-audit form submission on /logistics-automation.
  This supplements (does not replace) the inline success state built
  into the form itself on that page.

  Routing note: placed as a flat file at the repo root rather than
  nested at logistics-automation/thank-you.html. logistics-automation.html
  (a file) and a would-be logistics-automation/ (a directory) can coexist
  on disk without conflict, but this repo's Vercel routing relies on
  cleanUrls:true with framework:null and no build step, and there was no
  safe way to confirm from the repo alone that a request to
  /logistics-automation would keep resolving unambiguously to
  logistics-automation.html once a same-named directory also existed
  beside it. Per this task's own fallback instruction, the flatter,
  unambiguous filename was used instead. Live URL: /logistics-automation-thank-you.
-->
