<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Brand gradient — Pink → Purple → Cyan @ 135°
         More saturated than v1 so the white-pink tail and the cyan tip pop on screen. -->
    <linearGradient id="artxX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#FFE7FF"/>
      <stop offset="20%" stop-color="#FFB3FE"/>
      <stop offset="50%" stop-color="#8437F5"/>
      <stop offset="78%" stop-color="#3A6BFF"/>
      <stop offset="100%" stop-color="#00A8FF"/>
    </linearGradient>

    <!-- Soft ambient orb behind the X — large + low opacity, keeps the X crisp. -->
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#8437F5" stop-opacity="0.40"/>
      <stop offset="50%" stop-color="#00A8FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#000000"/>

  <!-- Ambient bloom behind the X (separate layer — keeps the X edges sharp). -->
  <circle cx="960" cy="540" r="650" fill="url(#orb)"/>

  <!-- The actual ArtX X mark — clean, sharp, no SVG bloom filter.
       Path is from the official brand SVG (no modification).
       Transform calculated so the X is centered at (960,540) with ~950px width. -->
  <g transform="translate(-1206.4,-1605.7) scale(3.85)">
    <path fill="url(#artxX)"
      d="M679.5,546.7c-1.7,3.7-32.6,78.7-60.5,81.6-20.7,2.2-25.3-51.2-26.8-57.1,8.2-11.5,52.6-78.8,53.5-80.1l-26.4-10.1c-.7,1-24.3,36.8-35.8,53.6-6-44-30-50.1-50.4-45.5-30.6,6.8-58.8,83.3-78.6,115l6.1,29.7c34-31,55-116,81.3-119.6,18.8-2.6,23.1,38.7,23.9,46.9-15.7,24-49.7,74.2-51.9,77.9l26,10.4c1.5-2.4,32.3-48.6,34.5-51.7,5.4,36.3,18.6,57.4,42.3,56.4,46.3-1.9,85.1-96.3,85.1-96.3l-22.3-11Z"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)" pointer-events="none"/>
</svg>
