    <!--
      Structured data — WebPage + BreadcrumbList + Organization + Service + FAQPage.
      Deliberately excluded: AggregateRating, Review, LocalBusiness address and any
      award claim, none of which are verified.
      The FAQ entries mirror src/components/logistics/Faq.jsx — keep both in sync.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://artx.agency/#org",
            "name": "ArtX Creative Agency",
            "alternateName": "ArtX",
            "url": "https://artx.agency",
            "logo": "https://artx.agency/favicon.svg",
            "email": "hello@artx.agency"
          },
          {
            "@type": "WebPage",
            "@id": "https://artx.agency/logistics-automation#webpage",
            "url": "https://artx.agency/logistics-automation",
            "name": "AI Automation for Logistics Companies | ArtX Agency",
            "description": "ArtX helps logistics and transportation companies automate repetitive work across email, documents, spreadsheets, customer requests and internal systems.",
            "isPartOf": { "@id": "https://artx.agency/#website" },
            "about": { "@id": "https://artx.agency/logistics-automation#service" },
            "breadcrumb": { "@id": "https://artx.agency/logistics-automation#breadcrumb" },
            "primaryImageOfPage": {
              "@type": "ImageObject",
              "url": "https://artx.agency/hero/hero-poster.jpg",
              "width": 1280,
              "height": 720
            },
            "inLanguage": "en"
          },
          {
            "@type": "BreadcrumbList",
            "@id": "https://artx.agency/logistics-automation#breadcrumb",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://artx.agency/" },
              { "@type": "ListItem", "position": 2, "name": "AI Automation for Logistics" }
            ]
          },
          {
            "@type": "Service",
            "@id": "https://artx.agency/logistics-automation#service",
            "name": "AI Automation for Logistics Operations",
            "serviceType": "Logistics workflow automation",
            "description": "Design and implementation of practical AI-powered workflows for logistics, transportation, freight forwarding and supply-chain companies, built around the systems they already use.",
            "provider": { "@id": "https://artx.agency/#org" },
            "areaServed": [
              { "@type": "Place", "name": "Europe" },
              { "@type": "Place", "name": "Worldwide" }
            ],
            "audience": {
              "@type": "BusinessAudience",
              "name": "Small and mid-sized logistics, transportation and freight forwarding companies"
            },
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Logistics automation use cases",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Automated RFQ processing" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Shipment status request assistance" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Document data extraction" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Email classification and routing" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "CRM and spreadsheet updates" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Customer and supplier follow-ups" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Operations reporting" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Internal knowledge assistant" } }
              ]
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://artx.agency/logistics-automation#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What logistics processes can be automated?",
                "acceptedAnswer": { "@type": "Answer", "text": "Processes involving repetitive e-mails, documents, data entry, reporting, follow-ups, routing and system updates are often good candidates. The exact opportunity depends on the workflow, available data, business rules and system access." }
              },
              {
                "@type": "Question",
                "name": "Do we need to replace our existing software?",
                "acceptedAnswer": { "@type": "Answer", "text": "Usually not. ArtX first evaluates whether useful automation can be added around the systems already in place. In some cases, technical limitations may require a different approach." }
              },
              {
                "@type": "Question",
                "name": "Can you work with legacy logistics systems?",
                "acceptedAnswer": { "@type": "Answer", "text": "Potentially. Feasibility depends on whether the system offers an API, database access, exports, e-mail notifications, browser access or another reliable integration method." }
              },
              {
                "@type": "Question",
                "name": "Will AI send messages without human review?",
                "acceptedAnswer": { "@type": "Answer", "text": "Only if the agreed workflow allows it. Human approval can be required for quotes, sensitive customer communication, financial documents, exceptions and other high-impact actions." }
              },
              {
                "@type": "Question",
                "name": "How long does an automation project take?",
                "acceptedAnswer": { "@type": "Answer", "text": "A focused pilot may often take between two and six weeks. More complex projects can take longer depending on integrations, data quality, security requirements, testing and stakeholder availability." }
              },
              {
                "@type": "Question",
                "name": "How much does a project cost?",
                "acceptedAnswer": { "@type": "Answer", "text": "Pricing depends on workflow complexity, the number of integrations, document types, security requirements, support needs and implementation scope. The initial workflow audit helps define an appropriate pilot." }
              },
              {
                "@type": "Question",
                "name": "Can you automate WhatsApp communication?",
                "acceptedAnswer": { "@type": "Answer", "text": "Some WhatsApp workflows may be possible through approved WhatsApp Business solutions. Feasibility depends on the account setup, provider, consent requirements, message types and platform policies." }
              },
              {
                "@type": "Question",
                "name": "Is our company data secure?",
                "acceptedAnswer": { "@type": "Answer", "text": "Each project should be designed around the minimum required access, secure credential handling, appropriate permissions, testing controls and the client's security requirements. Specific security measures are agreed during project scoping." }
              },
              {
                "@type": "Question",
                "name": "Do you provide ongoing support?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. Support, monitoring, maintenance and improvement options can be included based on the requirements of the implemented workflow." }
              },
              {
                "@type": "Question",
                "name": "Can you support multilingual logistics operations?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. AI-assisted workflows may support multilingual classification, extraction, drafting and internal processing. Human review should remain available where accuracy or legal significance is important." }
              },
              {
                "@type": "Question",
                "name": "What happens during the free workflow audit?",
                "acceptedAnswer": { "@type": "Answer", "text": "We review one selected workflow, identify repetitive steps, assess potential automation opportunities, discuss system constraints and recommend a practical next step. The audit does not include full development or a complete technical specification." }
              }
            ]
          }
        ]
      }
